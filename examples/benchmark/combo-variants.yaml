# Do the individually-best pieces work well together? Dense retrieval throughout.
#   heka-rag eval ablate -c bench.yaml -d questions.jsonl --variants combo-variants.yaml --retrieval-only -k 3
baseline:
  retrieval: {mode: dense}
parent-child:
  retrieval: {mode: dense}
  chunker: {provider: parent_child, params: {parent_size: 3200, child_size: 400, child_overlap: 50}}
structure-600+bge:
  retrieval:
    mode: dense
    reranker: {provider: local_cross_encoder, params: {model: BAAI/bge-reranker-base}}
  chunker: {provider: structure_aware, params: {chunk_size: 600, chunk_overlap: 80}}
parent-child+bge:
  retrieval:
    mode: dense
    reranker: {provider: local_cross_encoder, params: {model: BAAI/bge-reranker-base}}
  chunker: {provider: parent_child, params: {parent_size: 3200, child_size: 400, child_overlap: 50}}
