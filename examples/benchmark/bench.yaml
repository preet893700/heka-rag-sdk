# Base config for the benchmark. Variants (see *-variants.yaml) override parts of it.
preset: free-tier-dev
name: Benchmark
knowledge:
  sources:
    - location: ./docs
retrieval:
  mode: dense
  top_k: 20
  final_k: 5
# A regression floor, set a little below what this configuration measured when the benchmark was
# built (hit 0.97 / MRR 0.85 at k=5). It exists to catch accidental damage to the SDK, NOT as an
# accuracy target: targets for your own documents should come from your own questions.
#   kbsdk eval run -c bench.yaml -d questions.jsonl --retrieval-only     (exit code 1 on a miss)
evaluation:
  thresholds:
    retrieval_hit: 0.92
    retrieval_mrr: 0.78
