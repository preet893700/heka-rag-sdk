# Query rewriting and follow-up handling need a language model, so this comparison needs an API key
# (GOOGLE_API_KEY for the free-tier-dev preset). Each variant adds one model call per question.
#   heka-rag eval ablate -c bench.yaml -d questions.jsonl --variants llm-variants.yaml --retrieval-only \
#       --env-file ../../.env
base:
  retrieval: {mode: hybrid, reranker: {provider: local_cross_encoder}}
+condense-followups:
  retrieval: {mode: hybrid, reranker: {provider: local_cross_encoder}, condense_followups: true}
+rewrite:
  retrieval:
    mode: hybrid
    reranker: {provider: local_cross_encoder}
    query_transforms: [{provider: rewrite}]
+multi-query:
  retrieval:
    mode: hybrid
    reranker: {provider: local_cross_encoder}
    query_transforms: [{provider: multi_query, params: {n: 3}}]
+hyde:
  retrieval:
    mode: hybrid
    reranker: {provider: local_cross_encoder}
    query_transforms: [{provider: hyde}]
