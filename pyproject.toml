[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heka-rag-sdk"
version = "0.1.0"
description = "A configurable, plug-and-play RAG SDK with citations and built-in evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Hekaos" }]
maintainers = [{ name = "Hekaos" }]
keywords = ["rag", "retrieval", "llm", "citations", "evaluation", "knowledge-base"]
classifiers = [
  # Stops an accidental `twine upload` to the public PyPI; a private index ignores it.
  "Private :: Do Not Upload",
  "License :: Other/Proprietary License",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# Keep the core install light: heavy or provider-specific dependencies live in extras.
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
heka-rag = "heka.rag.cli:main"

[project.optional-dependencies]
pdf = ["pypdf>=4.0", "pdfplumber>=0.11"]
ocr = ["rapidocr>=3.0", "onnxruntime>=1.17", "pillow>=10.0"]
office = ["python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1"]
web = ["beautifulsoup4>=4.12"]
local = ["fastembed>=0.4"]
gemini = ["langchain-google-genai>=3.0", "langchain-core>=1.0"]
groq = ["langchain-groq>=1.0", "langchain-core>=1.0"]
anthropic = ["langchain-anthropic>=1.0", "langchain-core>=1.0"]
openai = ["langchain-openai>=1.0", "langchain-core>=1.0"]
ollama = ["langchain-ollama>=1.0", "langchain-core>=1.0"]
qdrant = ["qdrant-client>=1.9"]
agentic = ["langgraph>=1.0"]
otel = ["opentelemetry-api>=1.20"]
server = ["fastapi>=0.115", "uvicorn>=0.30", "pyjwt[crypto]>=2.8"]
all = [
  "heka-rag-sdk[pdf,ocr,office,web,local,gemini,groq,anthropic,openai,ollama,qdrant,agentic,otel,server]",
]
dev = [
  "heka-rag-sdk[all]",
  "opentelemetry-sdk>=1.20",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/heka"]

# The source distribution ships what is needed to run the tests, and nothing local (no .env, indexes or data).
[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/examples", "/docs", "/scripts",
  "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml", "/.env.example",
]
exclude = ["**/.heka-rag", "**/__pycache__", "**/*.pyc", "**/.env", "/data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# `ruff format` owns code layout; E501 would only flag prose it cannot rewrap (docstrings, prompts).
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
files = ["src"]
plugins = ["pydantic.mypy"]
