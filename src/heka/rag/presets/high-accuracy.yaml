# Accuracy over cost and speed: the strongest Claude model, the large local reranker (best ordering in the
# benchmark, about 2 s of CPU per question and a 1 GB model), and a claim-verification pass that declines
# answers its own sources do not support. Needs ANTHROPIC_API_KEY. Retrieval stays dense: hybrid did not
# help on the benchmark (see README, "What was measured"); test it on your own questions.
# Model names change often - check the provider's docs and override `model` if one is retired.
config_version: 1
embedder:
  provider: local
  params:
    model: BAAI/bge-small-en-v1.5
store:
  provider: local
retrieval:
  mode: dense
  top_k: 20
  final_k: 5
  reranker:
    provider: local_cross_encoder
    params:
      model: BAAI/bge-reranker-base
generation:
  llm:
    provider: claude
    params:
      model: claude-opus-5
      api_key_env: ANTHROPIC_API_KEY
  citations:
    mode: sdk
    require_verified: true
  verify_answer: true
  verify_action: abstain
reliability:
  max_retries: 3
