# Cost and latency first: a small model, local embeddings, no reranking or verification pass, and a cache
# so repeated questions cost nothing. Needs ANTHROPIC_API_KEY in the environment.
# Model names change often - check the provider's docs and override `model` if one is retired.
config_version: 1
embedder:
  provider: local
  params:
    model: BAAI/bge-small-en-v1.5
store:
  provider: local
retrieval:
  mode: dense
  top_k: 10
  final_k: 4
generation:
  llm:
    provider: claude
    params:
      model: claude-haiku-4-5
      api_key_env: ANTHROPIC_API_KEY
      max_output_tokens: 600
cache:
  provider: disk
